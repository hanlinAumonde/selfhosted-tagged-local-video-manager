<h2 mat-dialog-title>New Folder</h2>
<mat-dialog-content>
  <p class="mb-3 text-sm text-gray-600 dark:text-gray-300">
    Created in <span class="font-mono font-bold">{{ data.parentPath || 'the current directory' }}</span>
  </p>
  <form [formRoot]="folderForm">
    <mat-form-field class="w-full">
      <mat-label>Folder name</mat-label>
      <input matInput [formField]="folderForm.name" cdkFocusInitial autocomplete="off" />
      @if (folderForm.name().invalid() && (folderForm.name().dirty() || folderForm.name().touched())) {
        <mat-error>{{ folderForm.name().errors()[0].message }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  @if (folderForm().submitting()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  <button matButton mat-dialog-close [disabled]="folderForm().submitting()">Cancel</button>
  <button
    matButton
    [disabled]="folderForm().invalid() || folderForm().submitting()"
    (click)="submitForm()"
  >
    Create
  </button>
</mat-dialog-actions>
<app-toast-displayer />
