<!-- Bottom Toolbar -->
<div class="fixed bottom-0 z-20 mt-5" [style.width]="tableWidth() + 'px'">
  <!-- Toggle Button -->
  <div class="flex justify-center">
    <div
      class="px-6 py-1 bg-neutral-300 dark:bg-neutral-700 hover:bg-neutral-200 dark:hover:bg-neutral-500 text-white
             rounded-t-lg cursor-pointer transition-colors shadow-2xl"
      (click)="toggleToolbar()"
    >
      <button matIconButton>
        <mat-icon
          class="transition-transform duration-300"
          [class.rotate-180]="toolbarVisible()"
          fontIcon="keyboard_arrow_up"
        ></mat-icon>
      </button>
    </div>
  </div>
  <!-- Toolbar Content -->
  <div
    class="overflow-hidden transition-[max-height,opacity] duration-300 ease-in-out"
    [style.max-height]="toolbarVisible() ? '160px' : '0px'"
    [style.opacity]="toolbarVisible() ? '1' : '0'"
  >
    <div class="flex items-center justify-between px-6 py-3 bg-neutral-300 dark:bg-neutral-700 text-white">
      <div class="flex-1 flex items-center min-w-0">
        <div class="gap-2 flex items-center shrink-0">
          <button
            mat-icon-button
            (click)="navigateOnClickButton(true)"
            [disabled]="!pathHistoryService.hasHistory()"
          >
            <mat-icon fontIcon="arrow_back"></mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="navigateOnClickButton(false)"
            [disabled]="!pathHistoryService.hasForward()"
          >
            <mat-icon fontIcon="arrow_forward"></mat-icon>
          </button>
        </div>
        <!-- What the table below is showing: a directory, or a set of search results. -->
        <span
          class="bg-gray-400 dark:bg-neutral-600 mx-4 px-3 py-2 rounded-lg flex items-center shrink-0"
          [matTooltip]="isSearching() ? 'Search result' : 'Current path'"
        >
          <mat-icon [fontIcon]="isSearching() ? 'search' : 'folder'"></mat-icon>
        </span>
        @if (isSearching()) {
          <button
            mat-icon-button
            class="shrink-0"
            matTooltip="Back to browsing"
            (click)="exitSearch.emit()"
          >
            <mat-icon fontIcon="keyboard_return"></mat-icon>
          </button>
          <div class="flex items-center gap-2 min-w-0 flex-1 overflow-hidden">
            @for (criterion of searchSummary(); track $index) {
              <span
                class="bg-neutral-800 px-2 py-0.5 rounded-lg font-mono truncate max-w-60 shrink-0 text-gray-200"
                [title]="criterion"
              >
                {{ criterion }}
              </span>
            }
          </div>
        } @else {
        <div class="flex items-center min-w-0 flex-1 overflow-hidden font-mono font-bold text-gray-200" #pathContainer>
          @if (hasOverflow()) {
            <button
              [matMenuTriggerFor]="overflowMenu"
              class="flex justify-center items-center shrink-0 w-9! h-9! min-w-0! 
                   hover:bg-neutral-500 hover:disabled:bg-neutral-500 disabled:cursor-no-drop rounded-full transition-colors"
            >
              <mat-icon fontIcon="keyboard_double_arrow_left"></mat-icon>
            </button>
            <mat-menu #overflowMenu>
              @for (item of hiddenPaths(); track $index) {
                <button mat-menu-item (click)="navigateOnClickPathElement($index)" [title]="item">
                  <span class="block truncate max-w-50">{{ item }}</span>
                </button>
              }
            </mat-menu>
            <span class="path-sep text-black dark:text-white whitespace-nowrap px-1 shrink-0">></span>
          }
          @for (pathElement of visiblePaths(); track $index) {
            <span
              class="path-item bg-neutral-800 px-1 rounded-lg cursor-pointer hover:bg-neutral-700
                     transition-colors truncate max-w-37.5 shrink-0"
              [title]="pathElement"
              (click)="navigateOnClickPathElement($index + visibleStartIndex())"
            >
              {{ pathElement }}
            </span>
            @if ($index < visiblePaths().length - 1) {
              <span class="path-sep text-black dark:text-white whitespace-nowrap px-1 shrink-0">></span>
            }
          }
        </div>
        }
      </div>
      <div class="flex items-end gap-2">
        <button
          class="px-4 py-2 bg-neutral-500 gap-2 flex items-center text-white rounded-lg
                 font-medium hover:bg-neutral-400 transition-colors"
          [matMenuTriggerFor]="optionsMenu"
        >
          <mat-icon fontIcon="tune"></mat-icon>
          <span class="text-md">Options</span>
          <mat-icon fontIcon="arrow_drop_up"></mat-icon>
        </button>
        <mat-menu #optionsMenu>
          <button
            mat-menu-item
            [disabled]="!canSearch()"
            [title]="canSearch() ? 'Search this directory and everything below it' : 'Enter a resource directory first'"
            (click)="openSearchPanel()"
          >
            <mat-icon fontIcon="search"></mat-icon>
            <span>Search</span>
          </button>
          <button
            mat-menu-item
            [disabled]="!canCreateFolder()"
            [title]="canCreateFolder() ? 'Create a new folder here' : 'Enter a resource directory first'"
            (click)="openNewFolderPanel()"
          >
            <mat-icon fontIcon="create_new_folder"></mat-icon>
            <span>New folder</span>
          </button>
          <button
            mat-menu-item
            [matMenuTriggerFor]="batchMenu"
            [disabled]="selectedCount() === 0"
          >
            <mat-icon fontIcon="checklist"></mat-icon>
            <span>Batch ({{ selectedCount() }})</span>
          </button>
        </mat-menu>
        <mat-menu #batchMenu>
          <button
            mat-menu-item
            (click)="openBatchOperationPanel()"
          >
            <mat-icon fontIcon="edit"></mat-icon>
            <span>Edit</span>
          </button>
          <button
            mat-menu-item
            (click)="openBatchDeleteCheckPanel()"
          >
            <mat-icon fontIcon="delete"></mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
      </div>

    </div>
  </div>
</div>
