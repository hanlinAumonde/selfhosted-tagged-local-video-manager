ROOT_PATH: $ROOT_PATH|

resource_paths:
  Local-resource:
    Resource-1: host_path_1
    Resource-2: host_path_2
  # it has to keep the same names as the ones in handler_config
  S3-resource:
    Resource-1: /

# a category with no entry here is served by the local filesystem.
handler_config:
  S3-resource:
    type: s3
    mounts:
      Resource-1:
        endpoint_url: $S3_RESOURCE_1_ENDPOINT_URL|http://localhost:9000
        access_key: $S3_RESOURCE_1_ACCESS_KEY|rustfsadmin
        secret_key: $S3_RESOURCE_1_SECRET_KEY|rustfsadmin
        bucket: $S3_RESOURCE_1_BUCKET|video-app
        region: $S3_RESOURCE_1_REGION|us-east-1

# Thumbnail persistent storage (optional, requires S3-compatible storage)
# If not configured, thumbnails are generated on-the-fly with ffmpeg (no persistence).
thumbnail_config:
  storage_category: S3-resource
  storage_pseudo_name: Resource-1

cache_config:
  max_size: 2048
  ttl: 300  # in seconds
  cache_type: cachetools

ffmpeg_semaphore_limit: 4

suggestion_limit:
  name: 10
  author: 10
  tag: 20

video_extensions:
  - .mp4
  - .avi
  - .mkv
  - .mov
  - .wmv
  - .flv
  - .webm
  - .m4v
  - .mpg
  - .mpeg

# Validation rules (sync with frontend environment.ts)
validation:
  name_max_length: 200
  author_max_length: 50
  introduction_max_length: 2000
  tag_max_length: 30
  max_tags_count: 50
  page_number_min: 1
  page_number_max: 10000
  series_name_max_length: 100

# Background task runner
tasks:
  max_concurrent: 2
  progress_flush_interval: 3.0

# Logging config
logging:
  log_dir: logs
  rotation: "10 MB"
  retention: "30 days"

# MongoDB config
mongo:
  host: $MONGO_HOST|localhost
  port: $MONGO_PORT|27017
  database: $MONGO_DATABASE|video_tag_db
  username: $MONGO_USERNAME|exampleUser001
  password: $MONGO_PASSWORD|examplePassword
