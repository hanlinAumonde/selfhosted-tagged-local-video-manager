ROOT_PATH: $ROOT_PATH|

resource_paths:
  Local-resource:
    # Host paths live in .env so docker-compose.yml can mount the same directories.
    # E.g. :
    Resource-1: $LOCAL_RESOURCE_1
    Resource-2: $LOCAL_RESOURCE_2
    Resource-3: $LOCAL_RESOURCE_3
  # it has to keep the same names as the ones in handler_config
  S3-resource:
    Resource-1: /

# a category with no entry here is served by the local filesystem.
handler_config:
  S3-resource:
    type: s3
    mounts:
      Resource-1:
        endpoint_url: $S3_RESOURCE_1_ENDPOINT_URL|http://localhost:9000
        access_key: $S3_RESOURCE_1_ACCESS_KEY
        secret_key: $S3_RESOURCE_1_SECRET_KEY
        bucket: $S3_RESOURCE_1_BUCKET|video-app
        region: $S3_RESOURCE_1_REGION|us-east-1

# Thumbnail persistent storage (optional, requires S3-compatible storage)
# If not configured, thumbnails are generated on-the-fly with ffmpeg (no persistence).
thumbnail_config:
  storage_category: S3-resource
  storage_pseudo_name: Resource-1

cache_config:
  cache_type: redis  # redis | cachetools
  key_prefix: video-app
  # Seconds an entry lives, per purpose; each caller passes its own value on write.
  ttl:
    dir_metadata: 300
  redis:
    url: $REDIS_URL|redis://localhost:6379/0
    socket_timeout: 1.0
    # maxmemory / eviction policy belong to the Redis server: see docker-compose.yml.
  cachetools:
    max_size: 3000  # max number of entries

ffmpeg_semaphore_limit: 4
# Threads for blocking storage IO (local disk, S3 requests)
io_thread_pool_size: 32

suggestion_limit:
  name: 10
  author: 10
  tag: 20

video_extensions:
  - .mp4
  - .avi
  - .mkv
  - .mov
  - .wmv
  - .flv
  - .webm
  - .m4v
  - .mpg
  - .mpeg

# Validation rules (sync with frontend environment.ts)
validation:
  name_max_length: 200
  author_max_length: 50
  introduction_max_length: 2000
  tag_max_length: 30
  max_tags_count: 50
  page_number_min: 1
  page_number_max: 10000
  series_name_max_length: 100

# Background tasks (run by the worker processes, see src/worker.py)
tasks:
  # Carries the task queues and progress frames between the web process and workers.
  redis_url: $REDIS_URL|redis://localhost:6379/0
  # Migrations copying at once, across all devices.
  max_concurrent: 4
  # Copies at once on one device, by storage type.
  slots_per_device:
    local_fs: 1
    s3: 2
  # Mounts that live on the same physical disk must share a device name, or they are
  # throttled as separate disks. Key: "<category>/<pseudo_name>".
  devices: {}
  #   Local-resource/Resource-1: ssd-1
  #   Local-resource/Resource-2: ssd-2
  #   Local-resource/Resource-3: hdd-1
  # Copies at once on a named device, overriding slots_per_device: the storage type
  # cannot tell a solid-state disk from a spinning one. Key: a name from devices, or an
  # inferred one ("local:<category>/<pseudo_name>", "s3:<endpoint_url>/<bucket>").
  device_limits: {}
  #   ssd-1: 4
  #   ssd-2: 4
  # Also bounds how long a cancel takes to reach a running task.
  progress_flush_interval: 1.0
  observe_watchdog_interval: 10.0
  reconcile_interval: 300.0

# Logging config
logging:
  log_dir: logs
  rotation: "10 MB"
  retention: "30 days"

# MongoDB config
mongo:
  host: $MONGO_HOST|localhost
  port: $MONGO_PORT|27017
  database: $MONGO_DATABASE|video_tag_db
  username: $MONGO_USERNAME
  password: $MONGO_PASSWORD
