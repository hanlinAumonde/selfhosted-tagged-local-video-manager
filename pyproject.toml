[project]
name = "video-app"
version = "0.1.0"
description = "A simple web-based tool for viewing and searching local video files with tags."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "beanie==2.2.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic_settings==2.15.0",
    "pymongo==4.18.2",
    "strawberry-graphql==0.331.6",
    "uvicorn==0.54.0",
    "cachetools>=7.2.1",
    "loguru==0.7.3",
    # Never imported: uvicorn needs a WebSocket implementation to serve GraphQL subscriptions.
    "websockets==17.2",
    "boto3==1.43.108",
    "botocore==1.43.108",
    "envyaml==1.10.211231",
    "redis==8.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: mark a test as an unit test",
    "graphql: GraphQL interface tests (auto-applied to tests/graphql/)",
    "query: GraphQL query operation tests",
    "mutation: GraphQL mutation operation tests",
    "subscription: GraphQL subscription operation tests",
    "integration: mark a test as an integration test",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[redis]>=4.15.0",
    "boto3-stubs==1.43.108",
]
