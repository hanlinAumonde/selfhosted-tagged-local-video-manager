services:
  frontend:
    build:
      context: ./front-end/video-app-front
      dockerfile: Dockerfile
    container_name: video-app-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - video-app-network
    develop:
      watch:
        - action: rebuild
          path: ./front-end/video-app-front/src

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-app-backend
    ports:
      - "12000:12000"
    volumes:
      - ./logs:/app/logs
      # mount resource paths
      # make sure that these paths are same as those defined in config.yaml
      # format: /host/path:/app/resources/<category>/<pseudo_name>

      # e.g.:
      # /path/on/host:/app/resources/Local-resource/Resource-1
      # /another/path/on/host:/app/resources/Local-resource/Resource-2
    environment:
      - ROOT_PATH=/app/resources
      # MongoDB environment variables
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      # S3 resource-1 environment variables (make sure these match the ones in config.yaml)
      - S3_RESOURCE_1_ENDPOINT_URL=http://rustfs:9000
      - S3_RESOURCE_1_ACCESS_KEY=rustfsadmin
      - S3_RESOURCE_1_SECRET_KEY=rustfsadmin
      - S3_RESOURCE_1_BUCKET=video-app
      - S3_RESOURCE_1_REGION=us-east-1
      # Redis cache
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - video-app-network
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src

        - action: sync+restart
          path: ./main.py
          target: /app/main.py
        
        - action: sync+restart
          path: ./config.yaml
          target: /app/config.yaml
        
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  rustfs:
    image: rustfs/rustfs:latest
    container_name: video-app-rustfs
    command: /data
    ports:
      - "9000:9000"
      - "10086:9001"
    volumes:
      - ./rustfs_data:/data
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    restart: unless-stopped
    networks:
      - video-app-network

  mongodb:
    image: mongo:latest
    container_name: video-app-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    environment:
      - MONGO_INITDB_DATABASE=video_tag_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - video-app-network

  redis:
    image: redis:latest
    container_name: video-app-redis
    # A pure cache: memory is capped and the least recently used keys are evicted
    # at the cap; nothing is persisted to disk.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - video-app-network

networks:
  video-app-network:
    driver: bridge

volumes:
  mongodb_data:
  rustfs_data: